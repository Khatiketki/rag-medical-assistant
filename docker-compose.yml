services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [qdrant]
    ports: ["8001:8001"]

  gateway:
    build: ./gateway
    environment:
      RAG_SERVICE_URL: http://rag-service:8001
    depends_on:
      rag-service:
        condition: service_healthy
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [gateway]

volumes:
  qdrant_data:
